services:
  postgres:
    image: postgres:16-alpine
    container_name: proxygateway-postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${PG_DB_NAME:-proxygateway}
      POSTGRES_USER: ${PG_DB_USER:-proxygateway}
      POSTGRES_PASSWORD: ${PG_DB_PASS:?set PG_DB_PASS in .env}
    volumes:
      - proxygateway-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER:-proxygateway} -d ${PG_DB_NAME:-proxygateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: proxygateway-redis
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --save "" --appendonly no
    volumes:
      - proxygateway-redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  proxygateway-api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    container_name: proxygateway-api
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - PG_SERVER_PORT=8088
      - PG_METRICS_PORT=9099
      - PG_ENV=production
      - PG_DATABASE_URL=postgres://${PG_DB_USER:-proxygateway}:${PG_DB_PASS:?set PG_DB_PASS in .env}@postgres:5432/${PG_DB_NAME:-proxygateway}?sslmode=disable
      - PG_REDIS_URL=redis://redis:6379/0
      - PG_NINEROUTER_URL=${PG_NINEROUTER_URL:-http://ninerouter:20128}
      - PG_ADMIN_TOKEN=${PG_ADMIN_TOKEN:?set PG_ADMIN_TOKEN in .env}
      - PG_ADMIN_ALLOWED_ORIGINS=${PG_ADMIN_ALLOWED_ORIGINS:-*}
      - PG_GLOBAL_DENY_MODELS=${PG_GLOBAL_DENY_MODELS:-}
      - PG_GLOBAL_DENY_PROVIDERS=${PG_GLOBAL_DENY_PROVIDERS:-}
    ports:
      - "8088:8088"
      - "9099:9099"
    networks:
      - frontend
      - backend
      - centranity_shared

  proxygateway-tui:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.tui
    container_name: proxygateway-tui
    restart: unless-stopped
    depends_on:
      proxygateway-api:
        condition: service_healthy
    environment:
      - PG_API_BASE_URL=http://proxygateway-api:8088
      - PG_ADMIN_TOKEN=${PG_ADMIN_TOKEN:-}
    networks:
      - frontend
    stdin_open: true
    tty: true

networks:
  frontend:
    driver: bridge
  backend:
    internal: true
    driver: bridge
  centranity_shared:
    name: rys-centranity_default
    external: true

volumes:
  proxygateway-postgres-data:
    name: proxygateway-postgres-data
  proxygateway-redis-data:
    name: proxygateway-redis-data
